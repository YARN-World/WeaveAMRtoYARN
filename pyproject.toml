[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weave-amr2yarn"
version = "0.1.0"
description = "Convert Abstract Meaning Representation graphs into YARN graphs via GREW graph rewriting."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tadzhat Marharian" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]

# The core needs four things. `penman` parses AMR, `grewpy` drives the rule
# engine, `Levenshtein` backs the default anchorer, and `yarn_utils` turns a
# rewritten GREW graph into YARN.
#
dependencies = [
    "penman>=1.3",
    "grewpy>=0.7",
    "python-Levenshtein>=0.27",
    "yarn_utils @ git+https://gitlab.inria.fr/semagramme/yarn/yarn_utils@fb6f6f88134f89e45866ff2eacd4880ec1f2c764#subdirectory=utils",
    # tomllib is stdlib from 3.11; `weave batch` needs a reader before that.
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
# Only needed when UD is not supplied as CoNLL-U and has to be parsed from the
# raw sentence. Kept out of the core because it pulls in torch-scale weight.
stanza = ["stanza>=1.10"]

# In-process AMR parsing. unidecode and cached_property are amrlib's, but it
# does not declare them, so importing its models fails without them.
#
# The parse_xfm models work on current transformers (verified on 4.57 and
# 5.14). parse_spring does not: its tokenizer uses `tokenizer.encoder`, removed
# in transformers 5, so that one needs transformers<5.
parse = ["amrlib>=0.8", "unidecode", "cached_property"]

# The browser app. Kept out of the core so installing the library never
# pulls in a web framework.
ui = ["flask>=2.2"]

dev = ["pytest>=7", "stanza>=1.10", "flask>=2.2"]

[project.scripts]
weave = "weave_amr2yarn.cli:main"
weave-ui = "weave_ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"weave_amr2yarn" = ["grs/**/*.grs", "grs/**/*.lex", "grs/*.grs"]
"weave_amr2yarn.vendor.align2anchor" = ["*.md", "*.patch"]
"weave_ui" = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
